- company:
    name: GoPower! | Mobile Power Solutions - Dometic
    url: "https://gopowersolar.com/"
    location: Victoria, BC
    #logo: /images/sections/experiences/company1.jpg
    # Can optionally show a different logo for dark theme
    # darkLogo: /images/sections/experiences/company1.jpg
    # company overview
    overview: GoPower! (acquired by Dometic corporation) designs and manufactures solar panels, inverters, chargers, batteries, and solar charge controllers. I worked on the product development team as a firmware developer and lead the development on a variety of firmware projects. Projects frequently ran on an RTOS and involved using CAN, RS485, UART, SPI, and I2C to communicate with peripherals, other products, and other MCUs. On top of firmware, I was involved in many other aspects of product development and business operations.
  positions:
  - designation: Embedded Firmware Developper
    start: May 2023
    # don't provide end date if you are currently working there. It will be replaced by "Present"
    # end: Dec 2020
    # give some points about what was your responsibilities at the company.
    responsibilities:
    - Developing firmware in C/C++ on RTOS (FreeRTOS) and bare metal for new products.
    - Managing firmware development, releases, changelogs, version control (Git), and issue tracking. 
    - Defining communication/integration layers, UI/UX, and operational logic on a variety of new products.
    - Defining requirements and communication with contractors for firmware and product development.
    - Securing IP with flash encryption and secure boot. 
    - Developing internal development and sales support software applications for testing, updating devices in the field, or collecting data.
    - Developing IoT data collection devices for acquiring data the sales team can use to build business cases for products.
    - Using Microsoft Azure to manage and visualize collected data.
    - Coordinating the ordering of pre-programmed and encrypted MCU ICs.
    - Drawing system diagrams and electrical schematics.
    - Reading and using electrical schematics and datasheets to implement firmware.
    - Quality assurance testing and addressing quality alerts.
    - Testing hardware with oscilloscopes, bidirectional supplies, solar simulators, logic analyzers and more.
    - PCB and circuit design and review using Altium.
    - Conducting failure analysis on failed hardware.
    - Working with manufacturers to address production quality issues. 
    - Coordinating with contract manufacturers to load, test and calibrate firmware.
    - Project and product management.
    - Documenting procedures, architectures, test reports, and interface control. 
    - Writing content for technical documents and manuals. 
    - Defining new processes to improve quality, development efficiency, and organization. 
    - Defining requirements for new products.
    - Assisting sales teams in technical questions.
    - Training sales and technical support teams on new products.
    - Providing advanced technical support for system installers and customers.
    - Visiting OEMs and customers for support, information gathering, and assisting our sales team. 
    - Working with 3rd party integrators and RV OEMs to integrate with our systems and products.
    - Testing and validating requirements on products.
    - Maintaining membership to RVIA and contributing to RVIA standards and RV-C CAN protocol development. 

