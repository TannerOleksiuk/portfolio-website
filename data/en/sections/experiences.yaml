experiences:
- company:
    name: GoPower! | Mobile Power Solutions - Dometic
    url: "https://gopowersolar.com/"
    location: Victoria, BC
    #logo: /images/sections/experiences/company1.jpg
    # Can optionally show a different logo for dark theme
    # darkLogo: /images/sections/experiences/company1.jpg
    # company overview
    overview: GoPower! (acquired by Dometic corporation) designs and manufactures solar panels, inverters, chargers, batteries, and solar charge controllers. I worked on the product development team as a firmware developer and lead the development on a variety of firmware projects. Projects frequently ran on an RTOS and involved using CAN, RS485, UART, SPI, and I2C to communicate with peripherals, other products, and other MCUs. On top of firmware, I was involved in many other aspects of product development and business operations.
  positions:
  - designation: Embedded Firmware Developer
    start: May 2023
    # don't provide end date if you are currently working there. It will be replaced by "Present"
    # end: Dec 2020
    # give some points about what was your responsibilities at the company.
    responsibilities:
    - Developing firmware in C/C++ on RTOS (FreeRTOS) and bare metal for new products.
    - Managing firmware development, releases, changelogs, version control (Git), and issue tracking. 
    - Reading and using electrical schematics and datasheets to implement firmware.
    - Defining integration control documentation and communication protocols for interproduct operability.
    - Defining requirements and communicating with external design contractors for firmware, electrical specifications, and product development.
    - Implementing security and intellectual property protection with features like secure boot, flash encryption, and handshaking.  
    - Developing testing scripts, service tools, and development tools using Python and terminal scripting (bash, powershell). 
    - Coordinating with chip manufacturers and operations team to acquire pre-programmed and encrypted MCUs for production.
    - Drawing system diagrams and electrical schematics to support the sales team.
    - Quality assurance testing, addressing/discussing quality alerts, following quality procedures/documents (ECNs, ECRs, FMEAs).
    - Testing hardware with oscilloscopes, power supplies, DC loads, bidirectional supplies, solar simulators, AC loads, Hi-pot testers, and logic analyzers.
    - Setting up automated testing workflows and test stands that operate on real hardware.
    - PCB/circuit design and review using Altium.
    - Reviewing electronics designs and design decisions/documents from 3rd party contractors.
    - Conducting failure analysis on failed hardware.
    - Working with manufacturers to address production quality issues. 
    - Coordinating with contract manufacturers to load, test and calibrate firmware.
    - Documenting procedures, firmware architecture, test reports, and interface control. 
    - Reviewing, writing, and editing content for user facing technical documents and manuals. 
    - Defining new processes to improve quality, development efficiency, and organization. 
    - Developing on IoT devices for remote data acquisition to support sales and business cases.
    - Managing Microsoft Azure services and pipelines to collect and visualize data from remote devices.
    - Training sales and technical support teams on new products, processes, and quality issues.
    - Providing advanced technical support for system installers and customers. 
    - Assiting the sales and technical support team with technical questions and troubleshooting.
    - Visiting OEMs and customers for support, information gathering, and to assist our sales team. 
    - Working with 3rd party integrators and RV OEMs to integrate with our systems and products.
    - Managing time and prioritizing tasks in a fast paced work environment.
    - Maintaining membership to RVIA and contributing to RVIA standards and RV-C CAN protocol development. 

